[vars]
ALLOWED_ORIGINS = "http://127.0.0.1:3001,http://localhost:3000"
CONTACT_FROM_EMAIL = "contact@zacharysturman.com"
PUBLIC_API_URL = "http://localhost:8787"
PUBLIC_SITE_URL = "http://localhost:3000"
