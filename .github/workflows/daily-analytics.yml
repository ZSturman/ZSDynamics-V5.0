name: Daily analytics summary

on:
  schedule:
    # 14:00 UTC daily — adjust for your timezone if you want morning delivery.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render from live GA4 data and print it to the log without emailing"
        type: boolean
        default: false
      report_date:
        description: "Optional reporting date in Pacific time (YYYY-MM-DD)"
        type: string
      test_email:
        description: "Send a labeled acceptance email to the configured recipient"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run daily analytics summary
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          SITE_NAME: zacharysturman.com
          ANALYTICS_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          ANALYTICS_REPORT_DATE: ${{ inputs.report_date }}
          ANALYTICS_TEST_RUN: ${{ inputs.test_email && github.run_id || '' }}
          ANALYTICS_ACCESS_ENABLED: ${{ vars.ANALYTICS_ACCESS_ENABLED }}
          ANALYTICS_SESSION_STARTED_AT: ${{ vars.ANALYTICS_SESSION_STARTED_AT }}
        run: npm run daily-analytics
